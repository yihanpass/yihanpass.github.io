<p>hermes는 개발자 본인 1명이 자신의 구글 계정 데이터(Gmail, Calendar, Drive, Docs, Sheets, 연락처)를 처리하기 위해 사용하는 개인용 앱입니다.</p>
<p>수집한 데이터는 본인의 로컬 환경에서만 처리되며, 제3자에게 판매, 공유, 전송하지 않습니다.</p>
<p>구글 계정 설정에서 언제든 앱의 접근 권한을 회수할 수 있습니다.</p>
